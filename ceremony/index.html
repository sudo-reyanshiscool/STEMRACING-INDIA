<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEM Racing India National Finals 2026 awards ceremony</title>
<link rel="icon" href="assets/brand/signifier.png">
<style>
@font-face{font-family:"Magistral";src:url("assets/fonts/Magistral-BoldItalic.woff2") format("woff2");font-weight:700;font-style:italic}
@font-face{font-family:"Magistral";src:url("assets/fonts/Magistral-MediumItalic.woff2") format("woff2");font-weight:500;font-style:italic}
@font-face{font-family:"MachoModular";src:url("assets/fonts/MachoModular-Light.woff2") format("woff2");font-weight:300;font-style:normal}
@font-face{font-family:"MachoModular";src:url("assets/fonts/MachoModular-Medium.woff2") format("woff2");font-weight:400 500;font-style:normal}
@font-face{font-family:"MachoModular";src:url("assets/fonts/MachoModular-Bold.woff2") format("woff2");font-weight:700;font-style:normal}

:root{
  --carbon-shadow:#05000B;--carbon-800:#261A3D;--carbon-700:#2E2347;--carbon-500:#5B5376;--carbon-300:#A39FB8;--carbon-100:#D7D6E3;--white:#fff;
  --indigo:#312783;--violet:#961B81;--pink:#E6007E;--orange:#ED6D05;--gold:#FCBC00;
  --bg:var(--carbon-shadow);--fg:var(--carbon-100);--strong:var(--white);--muted:var(--carbon-300);--rule:var(--carbon-700);
  --display:"Magistral",Arial,system-ui,sans-serif;--body:"MachoModular",Arial,system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  --heading-gradient:linear-gradient(90deg,var(--violet) -15%,var(--pink) 52%,var(--orange) 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--fg);font-family:var(--body);font-weight:300;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- stage ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;background:var(--bg);overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.scene.on{opacity:1;visibility:visible;transition:opacity .9s ease .1s,visibility 0s}
#blackout{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:50}
#blackout.on{opacity:1}

/* chrome (persistent) */
#logo{position:absolute;left:96px;top:56px;height:60px;width:auto;z-index:5;transition:opacity .6s}
#event{position:absolute;right:96px;top:74px;font:500 24px/1 var(--body);letter-spacing:.04em;color:rgba(255,255,255,.85);z-index:5;transition:opacity .6s}
#cap-l,#cap-r{position:absolute;bottom:34px;font:400 24px/1 var(--body);letter-spacing:.03em;color:rgba(255,255,255,.85);z-index:5;transition:opacity .5s}
#cap-l{left:96px}#cap-r{right:96px}
#stage[data-kind="holding"] #logo,#stage[data-kind="holding"] #event{opacity:0}
#stage[data-gold="1"] #event,#stage[data-gold="1"] #cap-l,#stage[data-gold="1"] #cap-r{color:var(--carbon-shadow)}

/* atmosphere: full-bleed brand mesh gradients, colour floods */
.bg{position:absolute;inset:-12%;background-size:cover;background-position:center}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,0,11,.58) 0%,rgba(5,0,11,.22) 62%,rgba(5,0,11,.04) 100%)}
.veil.heavy{background:linear-gradient(90deg,rgba(5,0,11,.84) 0%,rgba(5,0,11,.6) 100%)}
.on .bg{animation:bgin 2.1s var(--ease) backwards}
@keyframes bgin{from{transform:scale(1.7) rotate(-9deg);opacity:0}}

/* outlined text track: the signature element (arrives, then rests) */
.track{position:absolute;left:0;width:1920px;overflow:hidden;white-space:nowrap;pointer-events:none;height:330px}
.track.a{top:40px}.track.b{top:710px}
.track .run{display:inline-block;font:700 italic 300px/330px var(--display);text-transform:uppercase;letter-spacing:.01em;
  color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.2)}
.track.b .run{transform:translateX(-50%)}
.on .track.a .run{animation:tra 2.4s var(--ease) .1s backwards}
.on .track.b .run{animation:trb 2.4s var(--ease) .1s backwards}
@keyframes tra{from{transform:translateX(-34%);opacity:0}}
@keyframes trb{from{transform:translateX(-14%);opacity:0}}

/* type */
.abs{position:absolute}
.eyebrow{font:500 30px/1.2 var(--body);letter-spacing:.05em;color:rgba(255,255,255,.82)}
.eyebrow b{font-weight:500;color:#fff}
.h{font:700 italic 120px/1.0 var(--display);color:#fff;padding-right:.12em}
.lead{font:300 40px/1.38 var(--body);color:#fff}
.label{font:500 22px/1 var(--body);letter-spacing:.08em;color:var(--muted)}
.muted{color:rgba(255,255,255,.8)}
.ph{color:rgba(255,255,255,.55)}

/* kinetic type: characters throw themselves in, then stop */
.kw{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .12em .2em 0;margin:-.06em -.12em -.2em 0}
.kc{display:inline-block}
.on .kc{animation:kin 1s cubic-bezier(.17,1.3,.3,1) calc(var(--d,0s) + var(--i)*.045s) backwards}
.res .kc{animation:none!important}
.result .res .kc{animation:kin 1.05s cubic-bezier(.17,1.3,.3,1) calc(.5s + var(--i)*.05s) backwards!important}
@keyframes kin{from{transform:translateY(118%) rotate(12deg) scale(.6);opacity:0}}

/* line mask reveals */
.ln{display:block;overflow:hidden;padding:.08em .15em .16em 0;margin:-.08em 0 -.16em 0}
.ln>span{display:block}
.on .ln>span{animation:rise 1s var(--ease) var(--d,0s) backwards}
.on .fade{animation:fadeup 1.1s var(--ease) var(--d,0s) backwards}
@keyframes rise{from{transform:translateY(112%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* welcome */
.stats{position:absolute;left:100px;right:100px;top:700px;display:flex;justify-content:space-between;gap:36px}
.stat{border-top:3px solid #fff;padding-top:24px;white-space:nowrap}
.stat .v{font:700 italic 100px/1 var(--display);color:#fff}
.stat .l{margin-top:14px;font:400 28px/1.25 var(--body);color:rgba(255,255,255,.85)}

/* running order */
.order{position:absolute;left:100px;right:100px;top:350px;display:grid;grid-template-columns:repeat(3,1fr);gap:34px 64px}
.ord .n{font:700 italic 34px/1 var(--display);color:var(--gold)}
.ord .t{margin-top:10px;font:700 italic 56px/1.05 var(--display);color:#fff}
.ord ul{list-style:none;margin-top:14px;border-top:2px solid rgba(255,255,255,.5)}
.ord li{font:400 27px/1.25 var(--body);color:#fff;padding:7px 0;border-bottom:1.5px solid rgba(255,255,255,.22)}

/* award card: title, then nominee bands one by one */
.noms{position:absolute;left:0;top:560px;width:1700px}
.noms .row{display:flex;align-items:center;margin-bottom:12px;padding-left:100px;color:#fff;
  font:700 italic 84px/1 var(--display);white-space:nowrap;
  clip-path:polygon(0 0,100% 0,calc(100% - 56px) 100%,0 100%);
  transform:translateX(-112%);transition:transform .95s cubic-bezier(.2,1.15,.3,1)}
.noms .row.in{transform:none}
.noms .row:nth-child(5n+1){background:var(--indigo)}
.noms .row:nth-child(5n+2){background:var(--violet)}
.noms .row:nth-child(5n+3){background:var(--pink)}
.noms .row:nth-child(5n+4){background:var(--orange)}
.noms .row:nth-child(5n+5){background:var(--gold);color:var(--carbon-shadow)}
.noms .row.ph{color:rgba(255,255,255,.7)}
.who{display:none}

/* reveal */
.gcap{position:absolute;left:0;right:0;top:330px;text-align:center;font:500 30px/1 var(--body);letter-spacing:.06em;color:var(--muted)}
.gantry{position:absolute;left:0;right:0;top:420px;display:flex;justify-content:center;gap:58px;transition:opacity .7s ease}
.lt{width:26px;height:150px;border-radius:13px;border:1.5px solid var(--carbon-500);transition:background-color .6s ease,box-shadow .9s ease,border-color .6s ease}
.lt.lit{background:var(--pink);border-color:var(--pink);box-shadow:0 0 70px 4px rgba(230,0,126,.32)}
.gsub{position:absolute;left:0;right:0;top:640px;text-align:center;font:400 26px/1 var(--body);letter-spacing:.04em;color:var(--carbon-500)}
.result .gantry,.result .gcap,.result .gsub{opacity:0;transition:opacity .5s ease}
.flood{position:absolute;inset:0;background-size:cover;background-position:center;clip-path:circle(0% at 50% 48%)}
.flood::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,0,11,.55) 0%,rgba(5,0,11,.16) 70%,rgba(5,0,11,.06) 100%)}
.flood::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(5,0,11,.8),transparent 60%);opacity:0;transition:opacity 1s ease}
.photo .flood::before{opacity:1}
.gold .flood::after{background:none}
.result .flood{clip-path:circle(150% at 50% 48%);transition:clip-path 1.5s cubic-bezier(.65,0,.2,1)}
.res{position:absolute;left:100px;top:330px;width:1720px;visibility:hidden}
.result .res{visibility:visible}
.res>*{opacity:0}
.result .res>*{opacity:1}
.res .name{font:700 italic 260px/1 var(--display);padding-right:.1em;color:#fff;width:max-content;max-width:100%}
.res .school{margin-top:18px;font:500 58px/1.2 var(--body);color:#fff}
.res .row{margin-top:40px;display:flex;justify-content:space-between;align-items:flex-end;gap:80px;border-top:3px solid #fff;padding-top:34px}
.res .cite{font:400 38px/1.4 var(--body);color:#fff;max-width:1100px}
.res .fig{text-align:right;flex:none}
.res .fig .fv{font:700 italic 110px/1 var(--display);color:#fff}
.res .fig .fl{margin-top:10px;font:500 26px/1 var(--body);letter-spacing:.08em;color:rgba(255,255,255,.85)}
.result .res .eyebrow{animation:fadeup 1s var(--ease) .2s backwards}
.result .res .school{animation:fadeup 1.1s var(--ease) 1.1s backwards}
.result .res .row{animation:fadeup 1.2s var(--ease) 1.6s backwards}
.gold .res,.gold .res *,.gold .lt3 *{color:var(--carbon-shadow)!important}
.gold .res .row{border-top-color:var(--carbon-shadow)}
.gold .lt3 .n{color:var(--carbon-shadow)}

/* photo moment: clear stage, lower third */
.reveal-photo{position:absolute;right:80px;bottom:0;height:720px;max-width:850px;z-index:1;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none;opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .9s var(--ease)}
.result .reveal-photo{opacity:.95;transform:none}
.photo .reveal-photo{opacity:1;transform:none;height:840px;right:60px;z-index:3}
.reveal-photo img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 20px 45px rgba(0,0,0,.75))}
.lt3{position:absolute;left:100px;bottom:130px;width:1500px;opacity:0;visibility:hidden;transform:translateY(40px);z-index:2;transition:opacity .8s ease .5s,transform 1.1s var(--ease) .5s,visibility 0s linear 1.3s}
.lt3 .e{font:500 28px/1.2 var(--body);letter-spacing:.05em;color:rgba(255,255,255,.85)}
.lt3 .n{margin-top:8px;font:700 italic 104px/1.05 var(--display);color:#fff;padding-right:.1em}
.lt3 .sc{margin-top:8px;font:500 40px/1.2 var(--body);color:#fff}
.photo .lt3{opacity:1;visibility:visible;transform:none;transition:opacity .9s ease .6s,transform 1.2s var(--ease) .6s,visibility 0s}
.photo .res{opacity:0;transition:opacity .6s ease;visibility:hidden}
.instant *{animation:none!important;transition:none!important}

/* build-up */
.bar{position:absolute;left:160px;top:650px;width:1600px;height:34px}
.seg{position:absolute;top:0;height:34px;background-image:var(--heading-gradient);background-size:1600px 34px;border-radius:2px;
  clip-path:inset(0 100% 0 0);transition:clip-path 1s var(--ease)}
.seg.show{clip-path:inset(0 0 0 0)}
.sl{position:absolute;width:300px;margin-left:-150px;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s var(--ease)}
.sl.show{opacity:1;transform:none}
.sl .sv{font:700 italic 62px/1 var(--display);color:#fff}
.sl .sn{margin-top:10px;font:400 25px/1.25 var(--body);color:#fff}
.sl.up{bottom:1080px}
.tally{position:absolute;left:160px;top:900px;font:400 28px/1 var(--body);color:rgba(255,255,255,.85);transition:opacity .8s}
.tally b{font:700 italic 56px/1 var(--display);color:#fff;margin-left:14px;vertical-align:-6px}
.rule-note{position:absolute;right:160px;top:896px;font:300 30px/1.3 var(--body);color:#fff;text-align:right;opacity:0;transition:opacity 1s ease}
.rule-note.show{opacity:1}

/* transition slats */
#wipe{position:absolute;inset:0;z-index:40;display:none;overflow:hidden;pointer-events:none}
#wipe .slat{position:absolute;will-change:transform}

/* podium: three bars climb */
.podium{position:absolute;inset:0}
.pod{position:absolute;bottom:0;width:500px;margin-left:-250px;text-align:center;padding-top:26px;color:#fff;
  transform:translateY(105%);transition:transform 1.1s cubic-bezier(.2,1.1,.3,1);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.pod.in{transform:none}
.pod.p1{height:800px;background:var(--gold);color:var(--carbon-shadow)}
.pod.p2{height:640px;background:var(--pink)}
.pod.p3{height:500px;background:var(--violet)}
.pod .no{font:700 italic 250px/1 var(--display);padding-right:.1em}
.pod .tn{margin-top:6px;font:700 italic 64px/1.05 var(--display);padding:0 20px}
.pod.p1 .tn{font-size:70px}
.pod .ts{margin-top:14px;font:500 28px/1.3 var(--body);padding:0 24px;opacity:.9}
.pod .pt{margin-top:12px;font:700 italic 44px/1 var(--display)}

/* results desk */
#desk{position:fixed;inset:0;z-index:100;background:#05000B;overflow:auto;display:none;font-family:var(--body)}
#desk.open{display:block}
.dk{max-width:1180px;margin:0 auto;padding:36px 32px 120px}
.dk h1{font:700 italic 44px/1.1 var(--display);color:var(--strong)}
.dk .bar2{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 14px}
.btn{min-height:44px;padding:0 20px;border-radius:4px;border:1.5px solid var(--carbon-500);background:transparent;color:var(--strong);cursor:pointer;font:500 18px/1 var(--body)}
.btn:hover{border-color:var(--pink)}
.btn.primary{background:var(--pink);border-color:var(--pink)}
.note{border:1.5px solid var(--gold);color:var(--strong);padding:14px 18px;border-radius:8px;margin:14px 0;font:400 18px/1.45 var(--body)}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font:500 15px/1 var(--body);letter-spacing:.06em;color:var(--muted)}
.field input,.field textarea{background:var(--carbon-800);border:1.5px solid var(--carbon-700);border-radius:4px;padding:11px 12px;color:var(--strong);font:400 18px/1.35 var(--body);width:100%;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--pink);outline:none}
.part{margin-top:22px;border:1.5px solid var(--carbon-700);border-radius:8px;padding:0 20px}
.part>summary{cursor:pointer;min-height:56px;display:flex;align-items:center;font:700 italic 26px/1 var(--display);color:var(--strong)}
.aw{padding:18px 0 22px;border-top:1.5px solid var(--carbon-700)}
.aw h3{font:700 italic 24px/1.1 var(--display);color:var(--strong);margin-bottom:12px}
.aw h3 small{font:400 16px/1 var(--body);color:var(--muted);margin-left:12px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid .wide{grid-column:1/-1}
.status{font:400 16px/1 var(--body);color:var(--muted)}

/* presenter */
body.presenter #viewport,body.presenter #desk{display:none!important}
#pv{display:none;position:fixed;inset:0;background:var(--bg);padding:32px 40px;overflow:auto;font-family:var(--body)}
body.presenter #pv{display:block}
#pv h1{font:700 italic 34px/1 var(--display);color:var(--strong)}
#pv .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
#pv .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
#pv .card{border:1.5px solid var(--carbon-700);border-radius:8px;padding:20px 24px}
#pv .card h2{font:500 16px/1 var(--body);letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
#pv .big{font:700 italic 40px/1.1 var(--display);color:var(--strong)}
#pv .sub{margin-top:8px;font:400 20px/1.3 var(--body);color:var(--muted)}
#pv .read{margin-top:22px;border-color:var(--pink)}
#pv .read .w{font:700 italic 54px/1.1 var(--display);color:var(--strong)}
#pv .read .s{margin-top:8px;font:500 26px/1.3 var(--body);color:var(--strong)}
#pv .read .c{margin-top:16px;font:300 30px/1.45 var(--body);color:var(--fg)}
#pv select{background:var(--carbon-800);border:1.5px solid var(--carbon-700);border-radius:4px;padding:10px 12px;color:var(--strong);font:400 18px var(--body);max-width:420px}

@media (prefers-reduced-motion:reduce){
  .mesh,.shape,.track .run{animation:none!important}
  #wipe{display:none!important}
  .on .ln>span,.on .fade,.on .wipe,.result .res>*{animation-duration:.01ms!important;animation-delay:0s!important}
  .result .res .name{animation:none!important;background-position:0 0}
  .scene,.scene.on,.seg,.sl,.lt{transition-duration:.15s!important}
}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage" data-kind="holding">
    <img id="logo" src="assets/brand/logo-full-colour-white.png" alt="STEM Racing">
    <div id="event">National Finals 2026</div>
    <div id="cap-l"></div><div id="cap-r"></div>
    <div id="wipe"></div>
    <div id="blackout"></div>
  </div>
</div>

<div id="desk" role="dialog" aria-label="Results desk"></div>
<div id="pv"></div>

<script>
(() => {
'use strict';

/* ================= data ================= */
const KEY = 'srindia-ceremony-2026';
const POSKEY = 'srindia-ceremony-position';
const PRESENTER = new URLSearchParams(location.search).has('presenter');

const PARTS = [
  { name: 'The pit wall',     awards: ['team-identity','pit-display','digital-media','sponsorship-marketing','sustainability'] },
  { name: 'The paddock',      awards: ['project-management','verbal-presentation','collaboration','women-in-motorsport','newcomer'] },
  { name: 'The garage',       awards: ['scrutineering','research-development','innovative-thinking','engineered-car'] },
  { name: 'The track',        awards: ['fastest-car','knockout'] },
  { name: 'The judges’ room', awards: ['chair'] },
  { name: 'The podium',       awards: ['third','second','champions'] }
];

const AW = {
  'team-identity':{name:'Team identity',basis:'Highest score',fig:'pts',
    rewards:'Brand consistency across the car, uniform, portfolios and pit.',
    cite:'{t} kept one clear identity running from the car to the uniform, the portfolios and the pit.'},
  'pit-display':{name:'Pit display',basis:'Highest score',fig:'pts',
    rewards:'Design process, content and impact, and the experience of every visitor.',
    cite:'{t} turned its pit into a story, with a display that showed the design process and welcomed every visitor.'},
  'digital-media':{name:'Digital media',basis:'Highest score',fig:'pts',
    rewards:'Proficiency in digital media.',
    cite:'{t} used digital media with real skill, telling its season clearly and consistently.'},
  'sponsorship-marketing':{name:'Sponsorship & marketing',basis:'Highest score',fig:'pts',
    rewards:'Marketing, sponsorship and return on investment, digital media and team identity.',
    cite:'{t} built sponsor relationships that paid off, and showed the return clearly in its marketing.'},
  'sustainability':{name:'Sustainability',basis:'Highest score',fig:'pts',
    rewards:'Economic, environmental and social practice.',
    cite:'{t} showed practical economic, environmental and social thinking, not just good intentions.'},
  'project-management':{name:'Project management',basis:'Highest score',fig:'pts',
    rewards:'Initiating, planning, executing, monitoring and controlling.',
    cite:'{t} planned, delivered and reviewed its work with discipline from the first week to the last.'},
  'verbal-presentation':{name:'Verbal presentation',basis:'Highest score',fig:'pts',
    rewards:'Technique, composition and subject matter.',
    cite:'{t} spoke with clarity and confidence, and every member knew the subject inside out.'},
  'collaboration':{name:'Best collaboration team',basis:'Highest score',fig:'pts',
    rewards:'Industry and higher education partnerships.',
    cite:'{t} worked with industry and university partners in ways that changed what the team could build.'},
  'women-in-motorsport':{name:'Women in motorsport',basis:'Judges’ choice',fig:'none',
    rewards:'Selected by the judging panel.',
    cite:'The judging panel chose {t} for the way its members have led, built and raced this season.'},
  'newcomer':{name:'Best newcomer',basis:'Highest score',fig:'pts',
    rewards:'Scores across all six judging categories.',
    cite:'{t} arrived new to the competition and scored across all six categories like a seasoned team.'},
  'scrutineering':{name:'Scrutineering',basis:'Highest score',fig:'pts',
    rewards:'Specification compliance, scored from 100 points.',
    cite:'{t} presented a car that met the specification from the first inspection.'},
  'research-development':{name:'Research and development',basis:'Highest score',fig:'pts',
    rewards:'Computer aided analysis, research and development, and testing.',
    cite:'{t} backed every design choice with analysis, testing and a clear record of what it learned.'},
  'innovative-thinking':{name:'Innovative thinking',basis:'Highest score',fig:'pts',
    rewards:'Innovation that is justified.',
    cite:'{t} took a bold idea and justified it with evidence, which is exactly what this award looks for.'},
  'engineered-car':{name:'Best engineered car',basis:'Highest score',fig:'pts',
    rewards:'Scrutineering, the design and engineering portfolio and race damage combined. Cars failing performance regulations are ineligible.',
    cite:'{t} combined a clean scrutineering result, a strong portfolio and a car that stayed intact on track.'},
  'fastest-car':{name:'Fastest car',basis:'Race result',fig:'time',

const TEAM_POOL = [
  ['Apex Orbit','Northfield International School'],['Quantum Drift','Lakeshore Academy'],
  ['Nova Slipstream','Cedar Valley School'],['Helix Racing','St Aldric’s College'],
  ['Vanta Velocity','Riverbend Senior School'],['Meridian Motion','Harrowgate International'],
  ['Zenith Thrust','Marlowe Hall School'],['Cobalt Comet','Summit Ridge Academy'],
  ['Solstice Racing','Ashgrove School'],['Kestrel Dynamics','Kestrel Park School'],
  ['Ember Circuit','Willowmere College'],['Polar Pulse','Brightwater Academy'],
  ['Radiant Rally','Oakhaven International'],['Vector Vanguard','Linden Court School'],
  ['Lumen Launch','Silverbirch School'],['Torque Tide','Eastbrook Academy'],
  ['Orbit Origin','Fairholme School'],['Mach Meridian','Stonebridge College']
];
function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sampleData(seed){
  const r = rngFrom(seed), S = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]} return b };
  const teams = S(TEAM_POOL).slice(0,16);
  const st = blank(); st.teams = String(teams.length); st.demo = true;
  const wins = teams.map(()=>0);
  const podium = S(teams.map((_,i)=>i)).slice(0,3);
  const totals = [ 905+Math.floor(r()*40) ]; totals.push(totals[0]-8-Math.floor(r()*25)); totals.push(totals[1]-6-Math.floor(r()*25));
  const set = (id, ti, figure, noms) => {
    const t = teams[ti], c = st.awards[id];
    c.winner = t[0]; c.school = t[1]; c.figure = figure;
    c.citation = AW[id].cite.replace('{t}', t[0]);
    c.nominees = noms.map(i=>teams[i][0]);
    wins[ti]++;
  };
  const nomsFor = ti => S(teams.map((_,i)=>i).filter(i=>i!==ti)).slice(0,2).concat(ti).sort(()=>r()-.5);
  set('champions', podium[0], totals[0]+' pts', podium.slice());
  set('second', podium[1], totals[1]+' pts', nomsFor(podium[1]));
  set('third', podium[2], totals[2]+' pts', nomsFor(podium[2]));
  Object.keys(AW).forEach(id=>{
    if (['champions','second','third'].includes(id)) return;
    const pool = teams.map((_,i)=>i).filter(i=>wins[i]<2);
    const ti = pool[Math.floor(r()*pool.length)];
    let fig = '';
    if (AW[id].fig==='pts') fig = (118+Math.floor(r()*70))+' pts';
    if (AW[id].fig==='time') fig = (1.021+r()*0.09).toFixed(3)+' s';
    set(id, ti, fig, nomsFor(ti));
  });
  return st;
}

const str = (s,n) => typeof s === 'string' ? s.slice(0,n) : '';
function sanitise(raw){
  const out = blank();
  if (!raw || typeof raw !== 'object') return out;
  out.teams = str(String(raw.teams ?? ''), 4);
  out.demo = raw.demo === true;
  if (typeof raw.presenter === 'string') out.presenter = str(raw.presenter, 200);

  Object.keys(AW).forEach(id => {

/* ================= scene behaviour ================= */
let timers = [];
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

function wireReveal(s){
  const el = s.el;
  const lights = () => el.querySelectorAll('.lt');
  s.running = false; s.steps = 1;
  s.apply = k => el.classList.toggle('photo', k >= 1);
  s.reset = () => { clearTimers(); s.step = 0; el.classList.remove('result','instant','photo'); lights().forEach(l=>l.classList.remove('lit')); s.running = false; };
  s.run = () => {
    s.running = true;
    lights().forEach((l,i) => later(()=>l.classList.add('lit'), 700 + i*900));
    const out = 700 + 4*900 + 1400;
    later(()=>lights().forEach(l=>l.classList.remove('lit')), out);
    later(()=>{ el.classList.add('result'); s.running = false; }, out + 800);
  };
  s.finish = instant => {
    clearTimers(); lights().forEach(l=>l.classList.remove('lit'));
    if (instant) el.classList.add('instant');
    el.classList.add('result'); s.running = false;
  };
}
function wireCard(s){
  const rows = () => [...s.el.querySelectorAll('.noms .row')];
  s.steps = rows().length;
  s.reset = () => { s.step = 0; rows().forEach(r=>r.classList.remove('in')); };
  s.apply = (k) => { rows().forEach((r,i)=>r.classList.toggle('in', i < k)); };
}
function wirePodium(s){
  const cols = () => ['p3','p2','p1'].map(c=>s.el.querySelector('.pod.'+c));
  s.steps = 3;
  s.reset = () => { s.step = 0; cols().forEach(c=>c.classList.remove('in')); };
  s.apply = k => { cols().forEach((c,i)=>c.classList.toggle('in', i < k)); };
}
function wireBuild(s){
  const el = s.el;
  const segs = () => [...el.querySelectorAll('.seg')], labs = () => [...el.querySelectorAll('.sl')];
  const tally = el.querySelector('.tally b'), note = el.querySelector('.rule-note');
  let cum = SPLIT.reduce((a,b)=>{a.push((a.length?a[a.length-1]:0)+b[1]);return a},[]);
  s.running = false;
  const show = (i, instant) => { segs()[i].classList.add('show'); labs()[i].classList.add('show'); tally.textContent = cum[i].toLocaleString('en-GB'); };
  s.reset = () => { clearTimers(); el.classList.remove('instant'); segs().forEach(x=>x.classList.remove('show')); labs().forEach(x=>x.classList.remove('show')); note.classList.remove('show'); tally.textContent='0'; s.running=false; };
  s.run = () => {
    s.running = true;
    SPLIT.forEach((_,i)=>later(()=>show(i), 1500 + i*1300));
    later(()=>{ note.classList.add('show'); s.running = false; }, 1500 + 5*1300 + 1400);
  };
  s.finish = instant => {
    clearTimers(); if (instant) el.classList.add('instant');
    SPLIT.forEach((_,i)=>show(i)); note.classList.add('show'); s.running = false;
  };
}

  const els = [], T = 520;
  let S = 40, from, to;
  const slat = (css, bg) => { const d = document.createElement('div'); d.className = 'slat'; d.style.cssText = css; d.style.background = bg; box.appendChild(d); els.push(d); return d; };
  if (v === 0 || v === 2){
    for (let i=0;i<10;i++) slat(`left:0;top:${i*108}px;width:100%;height:109px`, BRAND[i%5]);
    from = i => v===2 && i%2 ? 'translateX(101%)' : 'translateX(-101%)';
    to   = i => v===2 && i%2 ? 'translateX(-101%)' : 'translateX(101%)';
  } else if (v === 1){
    S = 28;
    for (let i=0;i<16;i++) slat(`top:0;left:${i*120}px;width:121px;height:100%`, BRAND[i%5]);
    from = () => 'translateY(101%)'; to = () => 'translateY(-101%)';
  } else {
    S = 80;
    for (let i=0;i<5;i++) slat(`top:0;left:-10%;width:120%;height:100%`, BRAND[i]).style.skew = '';
    const panel = slat(`top:0;left:-10%;width:120%;height:100%;background-size:cover;background-position:center`, '#05000B');
    panel.style.backgroundImage = 'url(assets/gradients/hot.png)';
    from = () => 'translateX(-125%) skewX(-16deg)'; to = () => 'translateX(125%) skewX(-16deg)';
  }
  const n = els.length, cover = T + (n-1)*S;
  els.forEach((el,i) => el.animate([{transform:from(i)},{transform:'none'}], {duration:T, delay:i*S, easing:EASE_IN, fill:'both'}));
  setTimeout(() => {
    swap();
    els.forEach((el,i) => el.animate([{transform:'none'},{transform:to(i)}], {duration:T, delay:i*S, easing:EASE_OUT, fill:'both'}));
    setTimeout(() => { box.style.display = 'none'; box.innerHTML = ''; done(); }, cover + 30);
  }, cover + 20);
}
function go(n, dir){
  n = Math.max(0, Math.min(sc.length-1, n));
  if (busy){ pending = { n, dir }; return; }
  if (cur && n === idx && cur.el.classList.contains('on')) return;
  const swap = () => {
    if (cur){ cur.el.classList.remove('on'); }
    clearTimers();
    idx = n; cur = sc[n];
    if (cur.reset) cur.reset();
    void cur.el.offsetWidth;
    cur.el.classList.add('on');
    if (cur.run){ if (dir === 'back') cur.finish(true); else cur.run(); }
    if (cur.steps){
      cur.step = (dir === 'back' && cur.kind !== 'reveal') ? cur.steps : 0;
      cur.apply(cur.step, true);
    }
    updateChrome();
    try { localStorage.setItem(POSKEY, String(idx)); } catch(e){}
    publish();
  };
  if (!cur || reducedMotion() || window.__noWipe){ swap(); return; }
  busy = true;
  runWipe(swap, () => { busy = false; if (pending){ const p = pending; pending = null; go(p.n, p.dir); } });
}
function next(){
  if (busy) { pending = { n: idx+1, dir:'fwd' }; return; }
  if (cur.running && cur.finish){ cur.finish(false); publish(); return; }
  if (cur.steps && cur.step < cur.steps){ cur.step++; cur.apply(cur.step); publish(); return; }
  go(idx+1,'fwd');
}
function prev(){
  if (busy) { pending = { n: idx-1, dir:'back' }; return; }
  if (!cur.running && cur.steps && cur.step > 0){ cur.step--; cur.apply(cur.step); publish(); return; }
  go(idx-1,'back');
}

/* ================= fit text ================= */
function fitAll(){
  document.querySelectorAll('[data-fit]').forEach(el => {
    const max = +el.dataset.max, min = +el.dataset.min, lines = +el.dataset.lines, w = +el.dataset.w;
    el.style.width = w + 'px'; el.style.display = 'block'; el.style.maxWidth = 'none';
    el.style.whiteSpace = lines === 1 ? 'nowrap' : 'normal';
    let fs = max; el.style.fontSize = fs + 'px';
    const lh = parseFloat(getComputedStyle(el).lineHeight) / fs || 1.02;
    const bad = () => el.scrollWidth > w + 1 || el.offsetHeight > fs*lh*lines + 4;
    while (bad() && fs > min){ fs -= 3; el.style.fontSize = fs + 'px'; }
    if (lines === 1 && bad()){
      /* very long name: allow two lines and shrink until they fit */
      el.style.whiteSpace = 'normal'; fs = min;
      const bad2 = () => el.scrollWidth > w + 1 || el.offsetHeight > fs*lh*2 + 4;
      el.style.fontSize = fs + 'px';
      while (bad2() && fs > 48){ fs -= 3; el.style.fontSize = fs + 'px'; }
    }
    if (lines === 1 && el.style.whiteSpace === 'nowrap') el.style.width = 'max-content';
  });
}

/* ================= scaling, fullscreen, cursor ================= */
function scale(){ const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `scale(${s})`; }
let hideTimer;
function cursorWake(){ document.body.style.cursor=''; clearTimeout(hideTimer); hideTimer = setTimeout(()=>{ document.body.style.cursor='none'; },2200); }
function toggleFull(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
}

/* ================= results desk ================= */
const desk = document.getElementById('desk');
let deskOpen = false;
function field(label, id, value, kind='input', attrs=''){
  const tag = kind==='area' ? `<textarea rows="${kind==='area'?3:1}" data-k="${id}" ${attrs}>${esc(value)}</textarea>` : `<input data-k="${id}" value="${esc(value)}" ${attrs}>`;
  return `<label class="field"><span>${label}</span>${tag}</label>`;
}
function renderDesk(){
  let html = `<div class="dk">
    <h1>Results desk</h1>
    <div class="bar2">
      <button class="btn primary" data-act="close">Close and apply</button>
      <button class="btn" data-act="export">Export JSON</button>
      <button class="btn" data-act="import">Import JSON</button>
      <button class="btn" data-act="sample">Fill with sample data</button>
      <button class="btn" data-act="clear">Clear everything</button>
      <span class="status" id="saved">Saved on this computer</span>
      <input type="file" id="imp" accept="application/json,.json" hidden>
    </div>
    ${state.demo?`<div class="note">Sample data is loaded. Every team, school and result is made up for the look. Use Clear everything before the event, then enter the real results.</div>`:''}
    <div class="grid" style="margin-bottom:6px">${field('Number of teams','teams',state.teams,'input','inputmode="numeric" maxlength="4"')}
      <div class="wide">${field('Presenter shown on award cards (name on the first line, role on the second)','presenter',state.presenter,'area','maxlength="200"')}</div></div>`;
  PARTS.forEach((p,pi) => {
    html += `<details class="part" ${pi===0?'open':''}><summary>${pi+1}. ${esc(p.name)}</summary>`;
    p.awards.forEach(id => {
      const d = state.awards[id];
      html += `<div class="aw" data-id="${id}"><h3>${esc(AW[id].name)}<small>${esc(AW[id].basis)}</small></h3>
        <div class="grid">
          ${field('Winner','winner',d.winner,'input','maxlength="80"')}
          ${field('School','school',d.school,'input','maxlength="100"')}
          ${field('Figure (race time or points)','figure',d.figure,'input','maxlength="24" placeholder="1.043 s or 842 pts"')}
          <div class="wide">${field('Citation, one or two lines','citation',d.citation,'area','maxlength="300"')}</div>
          <div class="wide">${field('Nominees, one per line','nominees',d.nominees.join('\n'),'area')}</div>
        </div></div>`;
    });
    html += `</details>`;
  });
  html += `<p class="status" style="margin-top:22px">Press Escape or E to close. Changes save as you type.</p></div>`;
  desk.innerHTML = html;
}
function openDesk(){ deskOpen = true; renderDesk(); desk.classList.add('open'); document.body.style.cursor=''; }
function closeDesk(){
  deskOpen = false; desk.classList.remove('open');
  buildScenes(); fitAll();
  const n = idx; cur = null; go(n);
}
desk.addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  if (k === 'teams') state.teams = e.target.value.replace(/[^\d]/g,'').slice(0,4);
  else if (k === 'presenter') state.presenter = e.target.value.slice(0,200);
  else {
    const id = e.target.closest('.aw').dataset.id, d = state.awards[id];
    if (k === 'nominees') d.nominees = e.target.value.split('\n').map(x=>x.trim().slice(0,80)).filter(Boolean).slice(0,8);
    else d[k] = e.target.value;
  }
  save();
  const s = document.getElementById('saved'); if (s) s.textContent = 'Saved on this computer';
});
desk.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
  if (act === 'close') closeDesk();
  if (act === 'export') exportJSON();
  if (act === 'import') document.getElementById('imp').click();
  if (act === 'sample'){ if (confirm('Replace everything on the desk with made up sample data?')){ state = sampleData(Math.floor(Math.random()*1e9)); save(); renderDesk(); } }
  if (act === 'clear'){ if (confirm('Clear every nominee, winner, school, figure and citation?')){ state = blank(); save(); renderDesk(); } }
});
desk.addEventListener('change', e => {
  if (e.target.id !== 'imp' || !e.target.files[0]) return;
  const f = e.target.files[0], r = new FileReader();
  r.onload = () => {
    try { state = sanitise(JSON.parse(r.result)); state.demo = false; save(); renderDesk(); const s=document.getElementById('saved'); if(s) s.textContent='Imported and saved'; }
    catch(err){ alert('That file could not be read as a results file.'); }
  };
  r.readAsText(f);
});
function exportJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'stem-racing-india-2026-results.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ================= presenter view ================= */
function summary(){
  const s = sc[idx], n = sc[idx+1];
  const rs = sc.slice(idx).find(x=>x.kind==='reveal' && x.part===s.part && (x.award===s.award || s.kind!=='reveal' && s.kind!=='card'));
  const subject = (s.kind==='card'||s.kind==='reveal') ? s : (n && (n.kind==='card'||n.kind==='reveal') ? n : null);
  const rv = subject ? sc.find(x=>x.kind==='reveal' && x.award===subject.award) : null;
  return {
    i: idx, total: sc.length, demo: state.demo,
    cur: { title: s.title, sub: s.sub + (s.steps ? (s.sub?' \u00B7 ':'') + `step ${s.step} of ${s.steps}` : '') }, next: n ? { title: n.title, sub: n.sub } : null,
    read: rv ? rv.read : null, blackout,
    list: sc.map((x,i)=>`${String(i+1).padStart(2,'0')}  ${x.title}`)
  };
}
function publish(){ if (pw && !pw.closed) pw.postMessage({type:'state', payload: summary()}, '*'); }
function openPresenter(){
  if (pw && !pw.closed){ pw.focus(); return; }
  pw = window.open(location.pathname + '?presenter=1', 'srindia-presenter', 'width=1180,height=820');
}
window.addEventListener('message', e => {
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (PRESENTER){
    if (m.type === 'state') renderPresenter(m.payload);
    return;
  }
  if (!pw || e.source !== pw) return;
  if (m.type === 'hello') publish();
  if (m.type === 'cmd'){
    if (m.cmd === 'next') next();
    if (m.cmd === 'prev') prev();
    if (m.cmd === 'black') toggleBlack();
    if (m.cmd === 'goto' && Number.isInteger(m.i)) go(m.i, m.i < idx ? 'back' : 'fwd');
  }
});

let pvState = null, t0 = Date.now();
function renderPresenter(p){
  pvState = p;
  const pv = document.getElementById('pv');
  const r = p.read;
  pv.innerHTML = `
    <div class="top"><h1>Presenter view</h1>
      <div class="status">Scene ${p.i+1} of ${p.total} · <span id="clock"></span>${p.blackout?' · Blackout on':''}${p.demo?' · Sample data':''}</div></div>
    <div class="cols">
      <div class="card"><h2>Now showing</h2><div class="big">${esc(p.cur.title)}</div><div class="sub">${esc(p.cur.sub)}</div></div>
      <div class="card"><h2>Next</h2><div class="big">${p.next?esc(p.next.title):'End of show'}</div><div class="sub">${p.next?esc(p.next.sub):''}</div></div>
    </div>
    ${r?`<div class="card read"><h2>Read out: ${esc(r.award)} · ${esc(r.basis)}</h2>
      <div class="w">${esc(r.winner)}</div><div class="s">${esc(r.school)}${r.figure?` · ${esc(r.figure)}${r.figureLabel==='Race time'?' race time':''}`:''}</div>
      <div class="c">${esc(r.citation)}</div></div>`:`<div class="card read" style="border-color:var(--carbon-700)"><h2>Read out</h2><div class="sub">Nothing to read on this scene.</div></div>`}
    <div class="top" style="margin-top:24px;justify-content:flex-start">
      <button class="btn" data-c="prev">Back</button><button class="btn primary" data-c="next">Next</button>
      <button class="btn" data-c="black">Blackout</button>
      <select id="jump" aria-label="Jump to scene">${p.list.map((t,i)=>`<option value="${i}" ${i===p.i?'selected':''}>${esc(t)}</option>`).join('')}</select>
    </div>`;
  tickClock();
}
function tickClock(){
  const c = document.getElementById('clock'); if (!c) return;
  const s = Math.floor((Date.now()-t0)/1000);
  c.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} open`;
}
if (PRESENTER){
  document.body.classList.add('presenter');
  document.title = 'Presenter view';
  const pv = document.getElementById('pv');
  pv.innerHTML = window.opener ? '<h1>Presenter view</h1><p class="sub">Waiting for the ceremony window.</p>'
                               : '<h1>Presenter view</h1><p class="sub">Open this from the ceremony window by pressing S.</p>';
  setInterval(tickClock, 1000);
  pv.addEventListener('click', e => {
    const c = e.target.closest('[data-c]')?.dataset.c;
    if (c && window.opener) window.opener.postMessage({type:'cmd', cmd:c}, '*');
  });
  pv.addEventListener('change', e => {
    if (e.target.id === 'jump' && window.opener) window.opener.postMessage({type:'cmd', cmd:'goto', i:+e.target.value}, '*');
  });
  window.addEventListener('keydown', e => {
    if (!window.opener || e.target.tagName === 'SELECT') return;
    const k = e.key;
    if (['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(k)){ e.preventDefault(); window.opener.postMessage({type:'cmd',cmd:'next'},'*'); }
    if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); window.opener.postMessage({type:'cmd',cmd:'prev'},'*'); }
    if (k.toLowerCase()==='b') window.opener.postMessage({type:'cmd',cmd:'black'},'*');
  });
  if (window.opener) window.opener.postMessage({type:'hello'}, '*');
  return;
}

/* ================= keys ================= */
function toggleBlack(){ blackout = !blackout; document.getElementById('blackout').classList.toggle('on', blackout); publish(); }
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const k = e.key;
  if (deskOpen){
    if (k === 'Escape'){ e.preventDefault(); closeDesk(); }
    else if (!typing && k.toLowerCase() === 'e'){ e.preventDefault(); closeDesk(); }
    return;
  }
  if (typing) return;
  if (['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(k)){ e.preventDefault(); next(); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
  else if (k === 'Home'){ e.preventDefault(); go(0,'back'); }
  else if (k === 'End'){ e.preventDefault(); go(sc.length-1,'fwd'); }
  else if (k.toLowerCase() === 'f'){ toggleFull(); }
  else if (k.toLowerCase() === 'b'){ toggleBlack(); }
  else if (k.toLowerCase() === 'e'){ openDesk(); }
  else if (k.toLowerCase() === 's'){ openPresenter(); }
});
window.addEventListener('resize', scale);
window.addEventListener('mousemove', cursorWake);

/* ================= start ================= */
state = load();
buildScenes();
scale();
cursorWake();
let startIdx = 0;
try { const p = parseInt(localStorage.getItem(POSKEY),10); if (p >= 0 && p < sc.length) startIdx = p; } catch(e){}
const h = parseInt(location.hash.slice(1),10); if (h >= 1 && h <= sc.length) startIdx = h-1;
const ready = (document.fonts && document.fonts.load) ?
  Promise.all(['700 italic 100px Magistral','500 italic 100px Magistral','300 20px MachoModular','500 20px MachoModular','700 20px MachoModular'].map(f=>document.fonts.load(f))) : Promise.resolve();
ready.catch(()=>{}).then(() => { fitAll(); go(startIdx); });
window.__ceremony = { go: (n,d) => go(n,d), next, prev, count: () => sc.length, idx: () => idx };
})();
</script>
