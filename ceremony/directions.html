<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEM Racing India awards ceremony, three directions</title>
<style>
@font-face{font-family:"Magistral";src:url("assets/fonts/Magistral-BoldItalic.woff2") format("woff2");font-weight:700;font-style:italic}
@font-face{font-family:"Magistral";src:url("assets/fonts/Magistral-MediumItalic.woff2") format("woff2");font-weight:500;font-style:italic}
@font-face{font-family:"MachoModular";src:url("assets/fonts/MachoModular-Light.woff2") format("woff2");font-weight:300}
@font-face{font-family:"MachoModular";src:url("assets/fonts/MachoModular-Medium.woff2") format("woff2");font-weight:400 500}
@font-face{font-family:"MachoModular";src:url("assets/fonts/MachoModular-Bold.woff2") format("woff2");font-weight:700}
:root{--shadow:#05000B;--c800:#261A3D;--c700:#2E2347;--c500:#5B5376;--c300:#A39FB8;--c100:#D7D6E3;
  --indigo:#312783;--violet:#961B81;--pink:#E6007E;--orange:#ED6D05;--gold:#FCBC00;
  --disp:"Magistral",Arial,sans-serif;--body:"MachoModular",Arial,sans-serif;--out:cubic-bezier(.16,1,.3,1);--io:cubic-bezier(.7,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--body);color:#fff}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;background:var(--shadow);overflow:hidden}
.dir{position:absolute;inset:0;display:none;overflow:hidden}
.dir.on{display:block}
.logo{position:absolute;left:96px;top:56px;height:60px;z-index:20}
#hud{position:fixed;left:14px;bottom:10px;font:400 14px/1.4 var(--body);color:rgba(255,255,255,.55);z-index:100;pointer-events:none;text-shadow:0 1px 3px #000}
.kw{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .12em .2em 0;margin:-.06em -.12em -.2em 0}
.kc{display:inline-block;transform:translateY(118%) rotate(10deg);opacity:0}
.go .kc{animation:kin 1s cubic-bezier(.17,1.3,.3,1) calc(var(--d,0s) + var(--i)*.045s) forwards}
@keyframes kin{to{transform:none;opacity:1}}

/* ============ A: timing tower ============ */
.dA{background:radial-gradient(1200px 700px at 85% 10%,#1d1233 0%,var(--shadow) 70%)}
.dA .a-grid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 54px)}
.dA .a-kicker{position:absolute;left:160px;top:170px;font:500 30px/1 var(--body);letter-spacing:.12em;color:var(--c300);opacity:0;transform:translateY(14px);transition:all .9s var(--out)}
.dA .a-title{position:absolute;left:160px;top:215px;font:700 italic 150px/1 var(--disp);color:#fff;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s var(--io);padding-right:.1em}
.dA .a-bar{position:absolute;left:160px;top:400px;height:6px;width:0;background:linear-gradient(90deg,var(--violet),var(--pink),var(--orange));transition:width 1.2s var(--io) .3s}
.dA.go .a-kicker{opacity:1;transform:none}
.dA.go .a-title{clip-path:inset(0 0 0 0)}
.dA.go .a-bar{width:1600px}
.dA .a-row{position:absolute;left:160px;width:1160px;height:150px;display:flex;align-items:center;gap:36px;padding:0 44px 0 0;
  background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-left:14px solid var(--tab);
  transform:translateX(-140px);opacity:0;transition:top 1s var(--io),height 1s var(--io),width 1s var(--io),opacity .8s ease,transform 1s var(--out),background .8s ease}
.dA .a-row.in{transform:none;opacity:1}
.dA .a-pos{width:110px;text-align:center;font:700 italic 64px/1 var(--disp);color:var(--c300)}
.dA .a-name{font:700 italic 84px/1 var(--disp);color:#fff;white-space:nowrap;transition:font-size 1s var(--io)}
.dA .a-sch{display:none;font:500 40px/1 var(--body);color:#fff;margin-top:14px}
.dA .a-txt{display:flex;flex-direction:column}
.dA .a-tag{margin-left:auto;font:500 26px/1 var(--body);letter-spacing:.1em;color:var(--c300)}
.dA .a-row.dim{opacity:.22}
.dA .a-row.win{width:1600px;height:290px;background:linear-gradient(90deg,var(--violet),var(--pink) 60%,var(--orange));border-left-color:#fff}
.dA .a-row.win .a-name{font-size:150px}
.dA .a-row.win .a-sch{display:block}
.dA .a-row.win .a-pos{color:#fff;font-size:110px}
.dA .a-row.win .a-tag{color:#fff}

/* ============ B: colour slam ============ */
.dB .b-p{position:absolute;inset:0;transition:clip-path .85s var(--io);overflow:hidden}
.dB .b-p0{background:var(--shadow)}
.dB .b-p1{background:var(--indigo);clip-path:inset(0 0 0 100%)}
.dB .b-p2{background:var(--violet);clip-path:inset(100% 0 0 0)}
.dB .b-p3{background:var(--pink);clip-path:circle(0% at 50% 50%)}
.dB .b-p4{background:var(--gold);color:var(--shadow);clip-path:inset(0 50% 0 50%)}
.dB .b-p1.in{clip-path:inset(0 0 0 0)}.dB .b-p2.in{clip-path:inset(0 0 0 0)}
.dB .b-p3.in{clip-path:circle(150% at 50% 50%)}.dB .b-p4.in{clip-path:inset(0 0 0 0)}
.dB .b-ghost{position:absolute;left:0;width:1920px;white-space:nowrap;font:700 italic 330px/330px var(--disp);text-transform:uppercase;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.28)}
.dB .b-p4 .b-ghost{-webkit-text-stroke-color:rgba(5,0,11,.22)}
.dB .b-ghost.g1{top:-40px}.dB .b-ghost.g2{top:720px;transform:translateX(-30%)}
.dB .b-tag{position:absolute;left:96px;top:150px;font:500 36px/1 var(--body);letter-spacing:.08em}
.dB .b-big{position:absolute;left:100px;right:100px;top:50%;transform:translateY(-52%);font:700 italic 400px/1 var(--disp);white-space:nowrap;padding-right:.1em}
.dB .b-school{position:absolute;left:100px;bottom:120px;font:500 64px/1 var(--body)}
.dB .b-fig{position:absolute;right:100px;bottom:116px;font:700 italic 96px/1 var(--disp)}
.dB .b-p0 .b-big{color:#fff}
.dB .b-count{position:absolute;right:100px;top:142px;font:700 italic 56px/1 var(--disp);opacity:.9}

/* ============ C: cinematic ============ */
.dC .c-bg{position:absolute;inset:-10%;background-size:cover;background-position:center;transition:opacity 1.6s ease,transform 3s var(--out)}
.dC .c-bg.b2{opacity:0}
.dC.s1 .c-bg,.dC.s2 .c-bg,.dC.s3 .c-bg{transform:scale(1.12) rotate(-2deg)}
.dC.s4 .c-bg.b1{opacity:0}.dC.s4 .c-bg.b2{opacity:1;transform:scale(1.2) rotate(2deg)}
.dC .c-veil{position:absolute;inset:0;background:radial-gradient(1400px 800px at 50% 50%,rgba(5,0,11,.15),rgba(5,0,11,.72));transition:opacity 1.2s ease}
.dC.s4 .c-veil{opacity:.25}
.dC .c-tag{position:absolute;left:0;right:0;text-align:center;top:250px;font:500 32px/1 var(--body);letter-spacing:.2em;color:rgba(255,255,255,.85);transition:all 1.1s var(--out)}
.dC .c-title{position:absolute;left:0;right:0;top:370px;text-align:center;font:700 italic 210px/1 var(--disp);color:#fff;transition:transform 1.3s var(--io),opacity 1s ease,filter 1s ease;transform-origin:50% 50%}
.dC.s1 .c-title,.dC.s2 .c-title,.dC.s3 .c-title{transform:translateY(-280px) scale(.38)}
.dC.s1 .c-tag,.dC.s2 .c-tag,.dC.s3 .c-tag{opacity:0;transform:translateY(-60px)}
.dC.s4 .c-title,.dC.s4 .c-tag{opacity:0;filter:blur(18px)}
.dC .c-line{position:absolute;left:0;right:0;text-align:center;font:700 italic 150px/1 var(--disp);color:#fff;opacity:0;filter:blur(24px);transform:translateY(60px) scale(.9);
  transition:transform 1.3s var(--io),opacity 1s ease,filter 1.1s ease,color .8s ease}
.dC .c-line.l0{top:300px}.dC .c-line.l1{top:490px}.dC .c-line.l2{top:680px}
.dC .c-line.in{opacity:1;filter:none;transform:none}
.dC .c-line.out{opacity:0;filter:blur(26px);transform:translateY(-70px) scale(.9)}
.dC .c-line.win{opacity:1;filter:none;color:var(--shadow);transform:translateY(-250px) scale(1.9)}
.dC .c-school{position:absolute;left:0;right:0;top:700px;text-align:center;font:500 62px/1 var(--body);color:var(--shadow);opacity:0;transform:translateY(30px);transition:all 1.2s var(--out) .7s}
.dC.s4 .c-school{opacity:1;transform:none}
.dC .c-lab{position:absolute;left:0;right:0;top:215px;text-align:center;font:500 34px/1 var(--body);letter-spacing:.2em;color:var(--shadow);opacity:0;transition:opacity 1s ease .8s}
.dC.s4 .c-lab{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <!-- A -->
  <section class="dir dA" id="dA">
    <div class="a-grid"></div>
    <img class="logo" src="assets/brand/logo-full-colour-white.png" alt="STEM Racing">
    <div class="a-kicker">National Finals 2026</div>
    <div class="a-title">Team identity</div>
    <div class="a-bar"></div>
    <div id="aRows"></div>
  </section>
  <!-- B -->
  <section class="dir dB" id="dB"></section>
  <!-- C -->
  <section class="dir dC" id="dC">
    <div class="c-bg b1" style="background-image:url(assets/gradients/hot.png)"></div>
    <div class="c-bg b2" style="background-image:url(assets/gradients/orange-yellow.png)"></div>
    <div class="c-veil"></div>
    <img class="logo" src="assets/brand/logo-full-colour-white.png" alt="STEM Racing">
    <div class="c-tag">NATIONAL FINALS 2026</div>
    <div class="c-title">Team identity</div>
    <div class="c-lab">TEAM IDENTITY WINNER</div>
    <div class="c-line l0"></div><div class="c-line l1"></div><div class="c-line l2"></div>
    <div class="c-school"></div>
  </section>
</div>
<div id="hud"></div>

<script>
(() => {
'use strict';
const DATA = {
  award: 'Team identity',
  nominees: ['Quantum Drift', 'Vector Vanguard', 'Helix Racing'],
  winner: 2, school: 'St Aldric’s College', figure: '126 pts'   /* made up, for the look */
};
const NAMES = { A:'A. Timing tower', B:'B. Colour slam', C:'C. Cinematic' };
const stage = document.getElementById('stage');
let dir = 'A', step = 0;
const MAXSTEP = 4;
const BRAND = ['var(--indigo)','var(--violet)','var(--pink)'];

function scale(){ const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `scale(${s})`; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function kin(t,d=0){ let i=0; return t.split(' ').map(w=>`<span class="kw">${[...w].map(c=>`<span class="kc" style="--i:${i++};--d:${d}s">${esc(c)}</span>`).join('')}</span>`).join(' '); }
function fit(el, maxW, maxPx, minPx){
  el.style.right = 'auto'; el.style.width = 'max-content';
  let fs = maxPx; el.style.fontSize = fs + 'px';
  while (el.offsetWidth > maxW && fs > minPx){ fs -= 6; el.style.fontSize = fs + 'px'; }
}

/* ---- A ---- */
const aRows = document.getElementById('aRows');
aRows.innerHTML = DATA.nominees.map((n,i)=>`
  <div class="a-row" data-i="${i}" style="--tab:${BRAND[i]};top:${450+i*170}px">
    <div class="a-pos">${i+1}</div>
    <div class="a-txt"><div class="a-name">${esc(n)}</div><div class="a-sch">${esc(DATA.school)}</div></div>
    <div class="a-tag">NOMINEE</div>
  </div>`).join('');
function applyA(s){
  const el = document.getElementById('dA');
  el.classList.add('go');
  const rows = [...aRows.children];
  rows.forEach((r,i)=>{
    r.classList.toggle('in', s > i && s <= 4 || (s === 4));
    r.classList.remove('win','dim');
    r.style.top = (450 + i*170) + 'px';
    r.querySelector('.a-tag').textContent = 'NOMINEE';
    r.querySelector('.a-pos').textContent = i+1;
  });
  if (s === 4){
    const w = DATA.winner; let k = 0;
    rows.forEach((r,i)=>{
      if (i === w){ r.classList.add('win'); r.style.top = '450px'; r.querySelector('.a-tag').textContent = 'WINNER'; r.querySelector('.a-pos').textContent = 'P1'; }
      else { r.classList.add('dim'); r.style.top = (450 + 290 + 30 + k*160) + 'px'; k++; }
    });
  }
}

/* ---- B ---- */
const dB = document.getElementById('dB');
const ghost = t => { const u = esc(t.toUpperCase()); return `<div class="b-ghost g1">${(u+' · ').repeat(6)}</div><div class="b-ghost g2">${(u+' · ').repeat(6)}</div>`; };
dB.innerHTML = `
  <div class="b-p b-p0 in">${ghost(DATA.award)}<img class="logo" src="assets/brand/logo-full-colour-white.png" alt="">
    <div class="b-tag" style="color:var(--c300)">NATIONAL FINALS 2026</div>
    <div class="b-big" data-fit="1700,330">${kin(DATA.award)}</div></div>
  ${DATA.nominees.map((n,i)=>`<div class="b-p b-p${i+1}">${ghost(n)}<img class="logo" src="assets/brand/logo-full-colour-white.png" alt="">
    <div class="b-tag">NOMINEE</div><div class="b-count">${i+1} / 3</div>
    <div class="b-big" data-fit="1700,400">${kin(n)}</div></div>`).join('')}
  <div class="b-p b-p4">${ghost(DATA.nominees[DATA.winner])}<img class="logo" src="assets/brand/logo-full-colour-black.png" alt="">
    <div class="b-tag">WINNER · ${esc(DATA.award.toUpperCase())}</div>
    <div class="b-big" data-fit="1700,400">${kin(DATA.nominees[DATA.winner])}</div>
    <div class="b-school">${esc(DATA.school)}</div><div class="b-fig">${esc(DATA.figure)}</div></div>`;
function fitB(){ dB.querySelectorAll('.b-big').forEach(el=>{ const [w,m] = el.dataset.fit.split(',').map(Number); fit(el,w,m,120); }); }
function applyB(s){
  [...dB.querySelectorAll('.b-p')].forEach((p,i)=>{
    const on = i <= s;
    if (p.classList.contains('in') !== (i===0 || on)) p.classList.toggle('in', i===0 || on);
    p.classList.toggle('go', on || i===0);
  });
  dB.querySelectorAll('.b-p')[0].classList.add('go','in');
}

/* ---- C ---- */
const dC = document.getElementById('dC');
const lines = [...dC.querySelectorAll('.c-line')];
lines.forEach((l,i)=>{ l.textContent = DATA.nominees[i]; });
dC.querySelector('.c-school').textContent = DATA.school;
function applyC(s){
  dC.className = 'dir dC on s' + s;
  lines.forEach((l,i)=>{
    l.className = 'c-line l' + i;
    if (s >= 1 && s < 4 && i < s) l.classList.add('in');
    if (s === 4) l.classList.add(i === DATA.winner ? 'win' : 'out');
  });
}

/* ---- driver ---- */
function show(d){
  dir = d; step = 0;
  ['A','B','C'].forEach(k => document.getElementById('d'+k).classList.toggle('on', k === d));
  document.getElementById('dA').classList.remove('go');
  [...aRows.children].forEach(r=>{ r.className = 'a-row'; });
  dB.querySelectorAll('.b-p').forEach((p,i)=>{ p.classList.remove('go'); if (i>0) p.classList.remove('in'); });
  document.getElementById('dC').className = 'dir dC s0' + (d === 'C' ? ' on' : '');
  lines.forEach((l,i)=>{ l.className = 'c-line l'+i; });
  fitB();
  requestAnimationFrame(()=>requestAnimationFrame(()=>apply()));
  hud();
}
function apply(){
  if (dir === 'A') applyA(step);
  if (dir === 'B') applyB(step);
  if (dir === 'C') applyC(step);
  hud();
}
function hud(){
  const labels = ['Title','Nominee 1','Nominee 2','Nominee 3','Winner'];
  document.getElementById('hud').textContent = `${NAMES[dir]}  |  step ${step}/4: ${labels[step]}  |  Right = next, Left = back, 1 2 3 = switch, R = restart`;
}
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(k)){ e.preventDefault(); if (step < MAXSTEP){ step++; apply(); } }
  else if (['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(k)){ e.preventDefault(); if (step > 0){ step--; apply(); } }
  else if (k === '1') show('A'); else if (k === '2') show('B'); else if (k === '3') show('C');
  else if (k.toLowerCase() === 'r') show(dir);
  else if (k.toLowerCase() === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
addEventListener('resize', scale);
scale();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{
  const h = location.hash.slice(1).toUpperCase();
  show(['A','B','C'].includes(h) ? h : 'A');
});
window.__dir = { show, next: () => { if (step < MAXSTEP){ step++; apply(); } }, step: () => step };
})();
</script>
</body>
</html>
