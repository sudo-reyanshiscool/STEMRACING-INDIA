<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SRi Car Analysis</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Magistral";font-weight:700;font-style:italic;src:url("../team-intro/assets/fonts/Magistral-BoldItalic.woff2") format("woff2");font-display:block}
@font-face{font-family:"Magistral";font-weight:500;font-style:italic;src:url("../team-intro/assets/fonts/Magistral-MediumItalic.woff2") format("woff2");font-display:block}
:root{--carbon:#05000B;--c800:#261A3D;--c700:#2E2347;--c300:#A39FB8;--c100:#D7D6E3;--indigo:#312783;--violet:#961B81;--pink:#E6007E;--orange:#ED6D05;--gold:#FCBC00;--white:#fff;--display:"Magistral","Arial Narrow",sans-serif;--ease:cubic-bezier(.16,.84,.28,1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:grid;place-items:center}
/* 16:9 screen that fits any window; everything inside is sized in cqw */
#screen{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;isolation:isolate;background:var(--carbon);container-type:inline-size;color:var(--white);font-family:var(--display);font-style:italic}
#bg{position:absolute;inset:0;z-index:-1}
#screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.7cqw;background:linear-gradient(90deg,var(--indigo),var(--violet),var(--pink),var(--orange),var(--gold))}
.view{position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.view.on{opacity:1}
.head{position:absolute;left:5cqw;right:5cqw;top:3.4cqw;display:flex;align-items:flex-end;justify-content:space-between;gap:3cqw}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:1.45cqw;color:var(--gold)}
.title{font-weight:700;text-transform:uppercase;font-size:4cqw;line-height:1.02;margin-top:.5cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70cqw;padding-right:.3em}
.tag{flex:none;font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:1.05cqw;padding:.55cqw 1.3cqw;border:.1cqw solid rgba(255,255,255,.5);border-radius:99cqw;color:var(--c100);margin-bottom:.6cqw}
.body{position:absolute;left:5cqw;right:5cqw;top:12.6cqw;bottom:3.6cqw}
.rise{animation:rise .9s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(1.4cqw)}}
@keyframes fade{from{opacity:0}}
.num{font-variant-numeric:tabular-nums}
/* team badge: the logo, or a roundel with initials */
.badge{flex:none;width:var(--s,4cqw);height:var(--s,4cqw);display:grid;place-items:center}
.badge img{width:100%;height:100%;object-fit:contain}
.badge.ph{border-radius:50%;border:.14cqw solid var(--tc,#fff);background:rgba(255,255,255,.08);font-weight:700;font-size:calc(var(--s,4cqw) * .3);letter-spacing:.02em}
/* race simulation */
.lane{position:absolute;left:0;right:0;height:13.2cqw}
.lane.l1{top:1.2cqw}.lane.l2{top:16.8cqw}
.lane .who{display:flex;align-items:center;gap:1.2cqw;height:4.4cqw;--s:4cqw}
.lane .nm{font-weight:700;text-transform:uppercase;font-size:2.5cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{flex:none;font-weight:500;font-size:1.25cqw;letter-spacing:.06em;text-transform:uppercase;padding:.3cqw 1cqw;border-radius:99cqw;border:.1cqw solid rgba(255,255,255,.4);color:var(--c100);opacity:0;transition:opacity .4s ease}
.chip.on{opacity:1}
.chip.time{margin-left:auto;font-weight:700;font-size:2.3cqw;border:0;padding:0;color:var(--white);letter-spacing:0}
.lane.won .chip.time{color:var(--gold)}
.strip{position:relative;height:7.4cqw;margin-top:.9cqw;border-radius:.5cqw;background:linear-gradient(180deg,rgba(5,0,11,.78),rgba(5,0,11,.56));border:.1cqw solid rgba(255,255,255,.14);overflow:hidden}
.strip::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - .08cqw),rgba(255,255,255,.14) calc(25% - .08cqw) 25%)}
.strip .fin{position:absolute;right:0;top:0;bottom:0;width:1.6cqw;background:conic-gradient(#fff 25%,#05000B 0 50%,#fff 0 75%,#05000B 0) 0 0/.8cqw .8cqw}
.strip .trail{position:absolute;left:0;top:50%;height:.5cqw;margin-top:-.25cqw;border-radius:99cqw;background:linear-gradient(90deg,transparent,var(--tc));opacity:.85;width:0}
.strip .car{position:absolute;left:0;top:50%;width:8cqw;height:4.6cqw;margin-top:-2.3cqw;display:grid;place-items:center;will-change:transform;filter:drop-shadow(0 0 1.2cqw color-mix(in srgb,var(--tc) 70%,transparent))}
.strip .gap{position:absolute;top:0;bottom:0;right:1.6cqw;background:rgba(252,188,0,.16);border-left:.22cqw solid var(--gold);animation:fade .5s both}
.strip .car img{width:100%;height:100%;object-fit:contain}
.strip .car svg{width:100%;height:auto;display:block}
.marks{position:absolute;left:0;right:0;top:31.2cqw;display:flex;justify-content:space-between;font-weight:500;font-size:1.1cqw;letter-spacing:.1em;color:var(--c300);text-transform:uppercase}
.clock{position:absolute;right:0;top:-8.6cqw;text-align:right}
.clock b{display:block;font-weight:700;font-size:5cqw;line-height:1}
.clock span{font-weight:500;font-size:1.05cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--c300)}
.lights{position:absolute;left:50%;top:-7.4cqw;transform:translateX(-50%);display:flex;gap:.9cqw;transition:opacity .5s}
.lights i{width:2.1cqw;height:2.1cqw;border-radius:50%;background:rgba(255,255,255,.12);border:.1cqw solid rgba(255,255,255,.25);transition:background .12s,box-shadow .12s}
.lights i.on{background:#ff2d3c;box-shadow:0 0 1.6cqw #ff2d3c}
.lights.go i{background:#34e06f;box-shadow:0 0 1.6cqw #34e06f}
.verdict{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:baseline;justify-content:center;gap:2.4cqw;opacity:0;transform:translateY(1.2cqw);transition:opacity .7s ease,transform .7s var(--ease)}
.verdict.on{opacity:1;transform:none}
.verdict b{font-weight:700;font-size:4.6cqw;color:var(--gold)}
.verdict span{font-weight:500;font-size:1.7cqw;letter-spacing:.1em;text-transform:uppercase;color:var(--c100)}
/* spider chart */
.radar{position:absolute;left:0;top:-1cqw;width:44cqw;height:41cqw}
.radar svg{width:100%;height:100%;overflow:visible}
.radar .ring{fill:none;stroke:rgba(255,255,255,.16);stroke-width:1}
.radar .ring.out{stroke:rgba(255,255,255,.4)}
.radar .spoke{stroke:rgba(255,255,255,.16);stroke-width:1}
.radar text{font-family:var(--display);font-style:italic;font-weight:700;font-size:17px;fill:#fff;text-transform:uppercase;letter-spacing:.06em}
.radar .shape{transform-origin:300px 280px;animation:grow 1.3s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes grow{from{transform:scale(0);opacity:0}}
.legend{position:absolute;right:0;top:0;bottom:0;width:38cqw;display:flex;flex-direction:column;justify-content:center;gap:2.2cqw}
.legend .t{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4cqw 1.2cqw;align-items:center;--s:4.6cqw;padding:1.3cqw 1.5cqw;border-radius:.7cqw;background:rgba(5,0,11,.5);border-left:.45cqw solid var(--tc)}
.legend .nm{font-weight:700;text-transform:uppercase;font-size:2.3cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .rows{grid-column:1 / -1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.35cqw 1cqw;align-items:center;margin-top:.5cqw;font-weight:500;font-size:1.15cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--c100)}
.bar{height:.5cqw;border-radius:99cqw;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--tc);transform-origin:left;animation:barin 1.1s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes barin{from{transform:scaleX(0)}}
/* leaderboard */
.board{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.brow{display:grid;grid-template-columns:3.2cqw 3.4cqw minmax(0,30cqw) minmax(0,1fr) 9cqw 9cqw;gap:1.4cqw;align-items:center;--s:3.2cqw;height:4.2cqw}
.brow .rk{font-weight:700;font-size:2.4cqw;color:var(--c300);text-align:right}
.brow:first-child .rk{color:var(--gold)}
.brow .nm{font-weight:700;text-transform:uppercase;font-size:2cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bar{height:1.1cqw}
.brow .tm{font-weight:700;font-size:2.3cqw;text-align:right}
.brow .gp{font-weight:500;font-size:1.35cqw;color:var(--c100);text-align:right;letter-spacing:.04em}
/* run chart */
.chart{position:absolute;left:0;top:0;bottom:0;width:58cqw}
.chart svg{width:100%;height:100%;overflow:visible}
.chart text{font-family:var(--display);font-style:italic;font-weight:500;font-size:15px;fill:var(--c100);letter-spacing:.06em}
.chart .line{fill:none;stroke:var(--tc);stroke-width:3;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s .3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .dot{animation:fade .5s both;animation-delay:var(--d,0s)}
.side{position:absolute;right:0;top:0;bottom:0;width:26cqw;display:flex;flex-direction:column;justify-content:center;gap:1.9cqw}
.side .who{display:flex;align-items:center;gap:1.2cqw;--s:5cqw}
.side .nm{font-weight:700;text-transform:uppercase;font-size:2.4cqw;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.kv span{display:block;font-weight:500;font-size:1.15cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--c300)}
.kv b{display:block;font-weight:700;font-size:3.5cqw;line-height:1.05}
.kv.gold b{color:var(--gold)}
/* one big number */
.stat{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6cqw}
.stat .who{display:flex;align-items:center;gap:1.4cqw;--s:6cqw}
.stat .nm{font-weight:700;text-transform:uppercase;font-size:3.4cqw}
.stat .val{font-weight:700;font-size:15cqw;line-height:.95;color:var(--gold);text-shadow:0 0 4cqw rgba(252,188,0,.35)}
.stat .unit{font-weight:500;font-size:1.7cqw;letter-spacing:.3em;text-transform:uppercase;color:var(--c100)}
.stat .sub{font-weight:500;font-size:1.5cqw;color:var(--c100);margin-top:1.2cqw}
/* field plot */
.field{position:absolute;inset:0}
.field svg{width:100%;height:100%;overflow:visible}
.field text{font-family:var(--display);font-style:italic;font-weight:500;font-size:15px;fill:var(--c100);letter-spacing:.06em}
.field .lab{font-weight:700;font-size:19px;fill:#fff;text-transform:uppercase}
.field .p{animation:pop .6s var(--ease) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(0)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;font-weight:500;font-size:2cqw;color:var(--c100)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head><body>
<div id="screen"><div id="bg"></div><div class="view" id="vA"></div><div class="view" id="vB"></div></div>
<script src="../shared/sr-background.js"></script>
<script>
(function(){
const NS='http://www.w3.org/2000/svg', SLOW=5;   // the race simulation plays at one fifth speed
const quiet=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=(tag,cls,text)=>{const n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=text; return n;};
const sv=(tag,at,text)=>{const n=document.createElementNS(NS,tag); for(const k in at)n.setAttribute(k,at[k]); if(text!=null)n.textContent=text; return n;};
const d=(n,delay)=>{n.style.setProperty('--d',delay+'s'); return n;};
const sec=ms=>(ms/1000).toFixed(3);
// shrink a one-line name until it fits; the size stays in cqw so it scales with the screen
const fit=n=>{requestAnimationFrame(()=>{const w=document.getElementById('screen').clientWidth; let px=parseFloat(getComputedStyle(n).fontSize); const min=px*.58;
  while(n.scrollWidth>n.clientWidth+1&&px>min){px-=.5; n.style.fontSize=(px/w*100)+'cqw';}}); return n;};
try{window.SRBackground&&SRBackground.mount(document.getElementById('bg'),'blue',{darken:.62});}catch(e){}
let teams={}, last=0, live=0, cur=0;
const views=[document.getElementById('vA'),document.getElementById('vB')];
const COLS=['#E6007E','#FCBC00'];
const team=id=>teams[id]||{name:'Team '+id};
const colour=(id,k)=>{const t=team(id); return k===0&&t.colors&&t.colors[0]?t.colors[0]:COLS[k];};
const src=p=>/^(data:|blob:|https?:|\.\.\/)/.test(p)?p:'../team-intro/'+p;
const initials=s=>s.split(/\s+/).filter(Boolean).map(w=>/^\d+$/.test(w)?w:w[0]).join('').slice(0,3).toUpperCase();
function badge(id){const t=team(id), b=el('div','badge'); if(t.logo){const i=el('img'); i.src=src(t.logo); i.alt=''; b.append(i);} else {b.classList.add('ph'); b.textContent=initials(t.name);} return b;}
function frame(scene){const head=el('div','head'), l=el('div'); l.append(d(el('div','eyebrow rise',scene.eyebrow||'Car analysis'),.05),d(fit(el('div','title rise',scene.title||'')),.15));
  head.append(l,d(el('div','tag rise','Car analysis'),.3)); const body=el('div','body'); return [head,body];}
// a plain dart for teams without a car picture
function dart(col){const s=sv('svg',{viewBox:'0 0 160 60','aria-hidden':'true'});
  s.append(sv('path',{d:'M4 34 L46 30 L70 18 L104 18 L150 31 L156 36 L150 41 L46 41 L4 38 Z',fill:col}),sv('path',{d:'M70 18 L84 6 L98 6 L104 18 Z',fill:col,opacity:.7}),
    sv('rect',{x:2,y:20,width:14,height:26,rx:3,fill:'#fff',opacity:.9}),sv('circle',{cx:40,cy:44,r:9,fill:'#05000B',stroke:'#fff','stroke-width':2}),sv('circle',{cx:128,cy:44,r:9,fill:'#05000B',stroke:'#fff','stroke-width':2}));
  return s;}

const SCENES={
  duel(scene,body,alive,head){
    const lanes=[scene.a,scene.b].map((x,k)=>{const t=team(x.id), col=colour(x.id,k), lane=el('div','lane l'+(k+1)+' rise'); d(lane,.25+k*.12); lane.style.setProperty('--tc',col);
      const who=el('div','who'), b=badge(x.id); b.style.setProperty('--tc',col);
      const react=el('span','chip num',x.reaction!=null?'Reaction '+sec(x.reaction):''), time=el('span','chip time num',sec(x.total));
      who.append(b,fit(el('span','nm',t.name)),react,time);
      const strip=el('div','strip'), trail=el('div','trail'), car=el('div','car'); if(t.car){const i=el('img'); i.src=src(t.car); i.alt=''; car.append(i);} else car.append(dart(col));
      strip.append(el('div','fin'),trail,car); lane.append(who,strip); body.append(lane); return {x,lane,react,time,strip,trail,car,done:false};});
    const marks=el('div','marks rise'); d(marks,.5); ['Start','5 m','10 m','15 m','Finish'].forEach(m=>marks.append(el('span',null,m))); body.append(marks);
    head.querySelector('.tag').hidden=true;
    const clock=el('div','clock rise'); d(clock,.4); const cb=el('b','num','0.000'); clock.append(cb,el('span',null,quiet?'Result':'Shown at one fifth speed')); body.append(clock);
    const lights=el('div','lights'); for(let k=0;k<3;k++)lights.append(el('i')); body.append(lights);
    const verdict=el('div','verdict'), fast=scene.a.total<=scene.b.total?0:1;
    verdict.append(el('span',null,scene.gapMs===0?'Dead heat':'Gap at the line'), el('b','num',scene.gapMs===0?'0.000 s':sec(scene.gapMs)+' s'), el('span',null,scene.gapMs===0?'':'about '+scene.gapCm+' cm')); body.append(verdict);
    // a hard launch for the first part of the run, then the car carries its speed to the line
    const A=.3, vmax=1/(1-A/2), pos=u=>u<=0?0:u>=1?1:u<A?vmax*u*u/(2*A):vmax*(u-A/2);
    const place=(L,f)=>{const span=L.strip.clientWidth-L.car.offsetWidth-L.strip.clientWidth*.016; L.car.style.transform='translateX('+(f*span)+'px)'; L.trail.style.width=(f*span+L.car.offsetWidth*.2)+'px';};
    // the moment the winner crosses the line, the distance the other car still has to go is marked on its lane
    const slowL=lanes[1-fast], gapAt=()=>{if(!scene.gapMs||slowL.gap)return; const f=pos((lanes[fast].x.total-(slowL.x.reaction||0))/(slowL.x.total-(slowL.x.reaction||0)));
      const span=slowL.strip.clientWidth-slowL.car.offsetWidth-slowL.strip.clientWidth*.016, g=el('div','gap'); g.style.left=(f*span+slowL.car.offsetWidth)+'px'; slowL.strip.insertBefore(g,slowL.trail); slowL.gap=g;};
    const finish=()=>{gapAt(); lanes.forEach((L,k)=>{place(L,1); L.react.classList.add('on'); L.time.classList.add('on'); if(k===fast&&scene.gapMs)L.lane.classList.add('won');}); cb.textContent=sec(Math.max(scene.a.total,scene.b.total)); lights.style.opacity=0; verdict.classList.add('on');};
    if(quiet){requestAnimationFrame(finish); return;}
    const t0=performance.now()+1500, end=Math.max(scene.a.total,scene.b.total);
    [0,1,2].forEach(k=>setTimeout(()=>{if(alive())lights.children[k].classList.add('on');},500+k*330));
    const tick=now=>{if(!alive())return; const t=(now-t0)/SLOW;   // race time in ms
      if(t>=0&&!lights.classList.contains('go')){lights.classList.add('go'); setTimeout(()=>{lights.style.opacity=0;},900);}
      cb.textContent=sec(Math.max(0,Math.min(end,t)));
      lanes.forEach(L=>{const r=L.x.reaction||0; if(t>=r)L.react.classList.add('on'); place(L,pos((t-r)/(L.x.total-r))); if(t>=L.x.total&&!L.done){L.done=true; L.time.classList.add('on');}}); if(t>=lanes[fast].x.total)gapAt();
      if(t<end)requestAnimationFrame(tick); else setTimeout(()=>{if(alive())finish();},350);};
    requestAnimationFrame(tick);
  },
  radar(scene,body){
    const sets=[scene.a,scene.b].filter(Boolean), axes=scene.a.values.map(v=>v[0]), n=axes.length, C=[300,280], R=205;
    const pt=(k,v)=>{const a=-Math.PI/2+k*2*Math.PI/n; return [C[0]+Math.cos(a)*R*v/100,C[1]+Math.sin(a)*R*v/100];};
    const poly=v=>axes.map((_,k)=>pt(k,v).join(',')).join(' ');
    const wrap=el('div','radar rise'); d(wrap,.2); const svg=sv('svg',{viewBox:'0 0 600 560','aria-hidden':'true'});
    [20,40,60,80,100].forEach(v=>svg.append(sv('polygon',{points:poly(v),class:'ring'+(v===100?' out':'')})));
    axes.forEach((name,k)=>{const o=pt(k,100), l=pt(k,117); svg.append(sv('line',{x1:C[0],y1:C[1],x2:o[0],y2:o[1],class:'spoke'}));
      svg.append(sv('text',{x:l[0],y:l[1]+6,'text-anchor':Math.abs(l[0]-C[0])<12?'middle':l[0]>C[0]?'start':'end'},name));});
    sets.forEach((s,k)=>{const col=colour(s.id,k), g=d(sv('g',{class:'shape'}),.6+k*.35), pts=s.values.map((v,i)=>pt(i,Math.max(4,v[1]==null?0:v[1])));
      g.append(sv('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:col,'fill-opacity':.28,stroke:col,'stroke-width':3,'stroke-linejoin':'round'}));
      pts.forEach(p=>g.append(sv('circle',{cx:p[0],cy:p[1],r:5,fill:col}))); svg.append(g);});
    wrap.append(svg); body.append(wrap);
    const legend=el('div','legend');
    sets.forEach((s,k)=>{const col=colour(s.id,k), card=el('div','t rise'); d(card,.5+k*.3); card.style.setProperty('--tc',col);
      const b=badge(s.id); b.style.setProperty('--tc',col); const rows=el('div','rows');
      s.values.forEach((v,i)=>{const bar=el('div','bar'), fill=d(el('i'),.9+k*.3+i*.06); fill.style.width=(v[1]==null?0:Math.max(3,v[1]))+'%'; bar.append(fill);
        rows.append(el('span',null,v[0]),bar,el('span','num',v[1]==null?'–':String(v[1])));});
      card.append(b,fit(el('div','nm',team(s.id).name)),rows); legend.append(card);});
    body.append(legend);
  },
  board(scene,body){
    const rows=scene.rows, best=rows[0].ms, worst=rows[rows.length-1].ms, board=el('div','board');
    rows.forEach((r,k)=>{const row=el('div','brow rise'); d(row,.25+k*.09); const col=k===0?'#FCBC00':'#E6007E'; row.style.setProperty('--tc',col);
      const b=badge(r.id); b.style.setProperty('--tc',col); const bar=el('div','bar'), fill=d(el('i'),.5+k*.09); fill.style.width=(100-(worst>best?(r.ms-best)/(worst-best)*55:0))+'%'; bar.append(fill);
      row.append(el('div','rk num',String(k+1)),b,fit(el('div','nm',team(r.id).name)),bar,el('div','tm num',sec(r.ms)),el('div','gp num',k?'+'+sec(r.ms-best):r.kmh.toFixed(1)+' km/h')); board.append(row);});
    body.append(board);
  },
  runs(scene,body){
    const col=colour(scene.team,0), rs=scene.runs, W=820,H=440, L=70,Rm=30,Tp=30,B=60;
    const lo=Math.min(scene.fieldBest,...rs.map(r=>r.ms)), hi=Math.max(...rs.map(r=>r.ms)), pad=Math.max(8,(hi-lo)*.18), y0=lo-pad, y1=hi+pad;
    const X=k=>rs.length===1?(L+W-Rm)/2:L+k*(W-L-Rm)/(rs.length-1), Y=ms=>Tp+(ms-y0)/(y1-y0)*(H-Tp-B);   // faster is higher
    const wrap=el('div','chart rise'); d(wrap,.2); wrap.style.setProperty('--tc',col); const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,'aria-hidden':'true'});
    for(let k=0;k<=4;k++){const ms=y0+(y1-y0)*k/4, y=Y(ms); svg.append(sv('line',{x1:L,x2:W-Rm,y1:y,y2:y,stroke:'rgba(255,255,255,.14)'}),sv('text',{x:L-12,y:y+5,'text-anchor':'end'},sec(ms)));}
    svg.append(sv('line',{x1:L,x2:W-Rm,y1:Y(scene.fieldBest),y2:Y(scene.fieldBest),stroke:'#FCBC00','stroke-dasharray':'6 6','stroke-width':1.5}),sv('text',{x:W-Rm,y:Y(scene.fieldBest)-8,'text-anchor':'end',fill:'#FCBC00'},'Fastest car in the field'));
    if(rs.length>1){const line=sv('polyline',{points:rs.map((r,k)=>X(k)+','+Y(r.ms)).join(' '),class:'line'}); svg.append(line); requestAnimationFrame(()=>{const len=line.getTotalLength(); line.style.setProperty('--len',len);});}
    rs.forEach((r,k)=>{const isBest=r.ms===scene.best, g=d(sv('g',{class:'dot'}),.5+k*.12);
      g.append(sv('circle',{cx:X(k),cy:Y(r.ms),r:isBest?10:7,fill:isBest?'#FCBC00':col,stroke:'#05000B','stroke-width':2}),sv('text',{x:X(k),y:H-B+26,'text-anchor':'middle'},rs.length>8?String(k+1):r.code)); svg.append(g);});
    wrap.append(svg); body.append(wrap);
    const side=el('div','side'), who=el('div','who rise'); d(who,.3); const b=badge(scene.team); b.style.setProperty('--tc',col); who.append(b,el('div','nm',team(scene.team).name)); side.append(who);
    const kv=(k,label,value,gold)=>{const n=el('div','kv rise'+(gold?' gold':'')); d(n,.45+k*.12); n.append(el('span',null,label),el('b','num',value)); side.append(n);};
    kv(0,'Best run',sec(scene.best)+' s',true); kv(1,'Average',sec(scene.mean)+' s');
    if(rs.length>1){kv(2,'Spread, slowest to fastest',sec(scene.spread)+' s'); kv(3,'Found since the first run',(scene.gain>0?'−':'')+sec(scene.gain)+' s');}
    body.append(side);
  },
  stat(scene,body){
    const w=el('div','stat'), who=el('div','who rise'); d(who,.25); who.append(badge(scene.team),el('div','nm',team(scene.team).name));
    w.append(who,d(el('div','val num rise',scene.value),.45),d(el('div','unit rise',scene.unit||''),.7)); if(scene.sub)w.append(d(el('div','sub rise',scene.sub),.95)); body.append(w);
  },
  field(scene,body){
    const ps=scene.points, W=1180,H=470, L=90,Rm=40,Tp=20,B=64, xs=ps.map(p=>p.x), ys=ps.map(p=>p.y);
    const fx=scene.xUnit==='sec'||!scene.xUnit?sec:v=>v.toFixed(1);
    const span=(a,f)=>{const lo=Math.min(...a), hi=Math.max(...a), pad=Math.max((hi-lo)*f,(hi-lo||1)*.02); return [lo-pad,hi+pad];}, [x0,x1]=span(xs,.08), [y0,y1]=span(ys,.1);
    const X=v=>L+(v-x0)/(x1-x0)*(W-L-Rm), Y=v=>H-B-(v-y0)/(y1-y0)*(H-Tp-B);   // quicker car is lower, quicker start is further left
    const wrap=el('div','field rise'); d(wrap,.2); const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,'aria-hidden':'true'});
    for(let k=0;k<=4;k++){const yv=y0+(y1-y0)*k/4, xv=x0+(x1-x0)*k/4;
      svg.append(sv('line',{x1:L,x2:W-Rm,y1:Y(yv),y2:Y(yv),stroke:'rgba(255,255,255,.12)'}),sv('text',{x:L-12,y:Y(yv)+5,'text-anchor':'end'},sec(yv)),sv('text',{x:X(xv),y:H-B+26,'text-anchor':'middle'},fx(xv)));}
    if(scene.trend){const t=scene.trend, ln=sv('line',{x1:X(t.x0),y1:Y(t.y0),x2:X(t.x1),y2:Y(t.y1),stroke:'#FCBC00','stroke-width':2.5,'stroke-dasharray':'10 8','stroke-linecap':'round',class:'p'}); svg.append(d(ln,1));
      svg.append(d(sv('text',{class:'p',x:X(t.x1)-6,y:Y(t.y1)+(t.y1>t.y0?-14:24),'text-anchor':'end',fill:'#FCBC00'},'TREND'),1.1));}
    svg.append(sv('text',{x:(L+W-Rm)/2,y:H-8,'text-anchor':'middle',fill:'#FCBC00'},scene.xLabel||''),sv('text',{x:18,y:(Tp+H-B)/2,'text-anchor':'middle',fill:'#FCBC00',transform:'rotate(-90 18 '+((Tp+H-B)/2)+')'},scene.yLabel||''));
    const mark=scene.mark||[];
    ps.filter(p=>!mark.includes(p.id)).forEach((p,k)=>svg.append(d(sv('circle',{class:'p',cx:X(p.x),cy:Y(p.y),r:7,fill:'#D7D6E3','fill-opacity':.55}),.4+k*.02)));
    mark.forEach((id,k)=>{const p=ps.find(q=>q.id===id); if(!p)return; const col=COLS[k%2], right=X(p.x)<W*.7;
      svg.append(d(sv('circle',{class:'p',cx:X(p.x),cy:Y(p.y),r:13,fill:col,stroke:'#fff','stroke-width':2.5}),1.2+k*.25),
        d(sv('text',{class:'lab p',x:X(p.x)+(right?22:-22),y:Y(p.y)+7,'text-anchor':right?'start':'end'},team(id).name),1.35+k*.25));});
    wrap.append(svg); body.append(wrap);
  }
};
function show(scene){const run=++live, alive=()=>run===live, next=views[1-cur];
  const [head,body]=frame(scene); next.replaceChildren(head,body);
  try{(SCENES[scene.kind]||((s,b)=>b.append(el('div','empty','Nothing to show yet.'))))(scene,body,alive,head);}catch(e){console.error(e); body.replaceChildren(el('div','empty','This analysis could not be drawn.'));}
  views[cur].classList.remove('on'); next.classList.add('on'); cur=1-cur;}
const fonts=document.fonts&&document.fonts.load?Promise.all(['italic 700 16px Magistral','italic 500 16px Magistral'].map(f=>document.fonts.load(f))).catch(()=>{}):Promise.resolve();
const boss=window.parent!==window?window.parent:window.opener;
window.addEventListener('message',e=>{const m=e.data; if(!m||m.app!=='sri-ana'||m.type!=='state'||!m.state||m.state.n<=last)return; if(boss&&e.source!==boss)return;
  last=m.state.n; teams=m.state.teams||{}; const scene=m.state.scene; fonts.then(()=>{if(m.state.n===last&&scene)show(scene);});});
try{boss&&boss.postMessage({app:'sri-ana',type:'hello'},'*');}catch(e){}
})();
</script>
